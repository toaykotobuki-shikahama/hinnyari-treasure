<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#c9f2ff">
    <meta name="robots" content="noindex,nofollow">
    <title>MISSION COMPLETE!｜夏のひんやりトレジャー</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-page="complete">
    <main>
      <p class="eyebrow">夏のひんやりトレジャー</p>
      <h1 class="brand">真実の入口</h1>

      <section class="card" data-screen="complete" hidden>
        <h2 class="complete-title">MISSION COMPLETE!</h2>
        <div class="answer">
          <img data-answer-image src="" alt="">
        </div>
        <p class="image-error" data-image-error hidden>
          答えの画像を準備中です。スタッフへこの画面をお見せください。
        </p>
        <p class="show-staff">この画像をスタッフに見せてね！</p>
        <p class="reward">この後もお楽しみください</p>
        <p class="note">画面は当日のみ有効です</p>
      </section>

      <section class="card status" data-screen="invalid" hidden>
        <h2>本日のミッションではありません</h2>
        <p>この画面は当日の合言葉から届いたリンクだけが有効です。<br>LINEのリッチメニューから今日のなぞに挑戦してください。</p>
      </section>
    </main>
    <script src="config/date-control.js"></script>
    <script src="config/campaign.js"></script>
    <script src="app.js"></script>
  </body>
</html>
